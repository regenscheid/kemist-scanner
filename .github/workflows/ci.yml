name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Run tests with all features
      run: cargo test --all-features --verbose

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --verbose

    - name: Build release
      run: cargo build --release --verbose

  feature_matrix:
    # Proves the legacy-probe feature boundary is honestly opt-out.
    # `minimal` drops the OpenSSL subsystem entirely; the new `tls.*`
    # sections render as empty / feature_disabled but the schema shape
    # stays stable. A previous `no-legacy-probes` variant referenced a
    # `native-legacy` feature that was removed in commit 7c21fe9; kept
    # removing it here so the matrix matches the actual Cargo features.
    name: Feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            # No legacy backend at all; the new tls.* sections render as
            # empty/feature_disabled but the schema shape stays stable.
            args: "--no-default-features --features http-checks"

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-feature-${{ matrix.variant }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build ${{ matrix.args }} --verbose

    - name: Test
      run: cargo test ${{ matrix.args }} --verbose

  release_size_gate:
    # Guards against accidental binary-size regressions now that
    # `legacy-probes` links a second crypto library (vendored OpenSSL 3.5
    # LTS). The threshold below was set by measuring the release binary
    # once the OpenSSL subsystem landed; raise it deliberately if a new
    # probe honestly needs the space, don't silently accept creep.
    name: Release binary size gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-size-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release --locked

    - name: Check binary size
      run: |
        SIZE=$(stat -c%s target/release/kemist)
        # 16 MiB. Current release binary is ~12.4 MiB on Linux after the
        # full OpenSSL 3.5.5 LTS subsystem landed (weak-crypto + ssl3 +
        # legacy provider + D1-D8 probe modules). Headroom absorbs
        # platform variance and small future additions; raise this
        # deliberately if a new probe honestly needs the space, don't
        # silently accept creep.
        MAX=$((16 * 1024 * 1024))
        echo "kemist release binary: ${SIZE} bytes (limit ${MAX})"
        if [ "${SIZE}" -gt "${MAX}" ]; then
          echo "::error::release binary exceeds ${MAX} bytes (got ${SIZE})"
          exit 1
        fi

  security_audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run cargo audit
      run: cargo audit

  license_deny:
    name: License and advisory checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Run cargo deny
      run: cargo deny check

  integration_test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build kemist
      run: cargo build --release

    - name: Build and run test servers
      run: |
        cd docker
        docker compose -f docker-compose.yml build
        docker compose -f docker-compose.yml up -d
        sleep 15

    - name: Run integration tests
      run: |
        cd docker
        chmod +x test-heartbleed.sh
        ./test-heartbleed.sh || echo "Heartbleed test completed"

    - name: Cleanup
      if: always()
      run: |
        cd docker
        docker compose -f docker-compose.yml down

  legacy_fixture_test:
    # integration tests: boots the OpenSSL 1.1.1 nginx fixture
    # at tests/fixtures/legacy-server/ (deliberately misconfigured with
    # @SECLEVEL=0, weak cipher list, 1024-bit custom DH, optional client
    # auth) and runs the `#[ignore]`-gated probe tests against it.
    name: Legacy probe integration (docker fixture)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build kemist (legacy-probes on)
      run: cargo build --tests --features legacy-probes

    - name: Generate fixture certificates and DH parameters
      run: |
        cd tests/fixtures/legacy-server
        ./generate-certs.sh

    - name: Start fixture
      run: |
        cd tests/fixtures/legacy-server
        docker compose up -d
        # Allow nginx to finish startup handshake generation on slow runners.
        for i in {1..30}; do
          if nc -zv 127.0.0.1 14443 2>/dev/null; then break; fi
          sleep 1
        done

    - name: Run integration tests
      env:
        KEMIST_LEGACY_FIXTURE_ADDR: 127.0.0.1:14443
        KEMIST_LEGACY_FIXTURE_HOSTNAME: legacy-fixture.local
      run: cargo test --features legacy-probes --test openssl_probe -- --ignored --test-threads=1

    - name: Cleanup
      if: always()
      run: |
        cd tests/fixtures/legacy-server
        docker compose down || true