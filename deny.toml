[graph]
all-features = true

[licenses]
confidence-threshold = 0.85
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# aws-lc-sys links against AWS-LC (an OpenSSL fork). Required transitively via rustls's
# aws-lc-rs crypto provider. Scoped exception — not a general OpenSSL allowance.
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-sys"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
