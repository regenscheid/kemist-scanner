[graph]
all-features = true

[licenses]
confidence-threshold = 0.85
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# OpenSSL-licensed crates. aws-lc-sys vends AWS-LC (an OpenSSL fork) via
# rustls's aws-lc-rs crypto provider. openssl/openssl-sys/openssl-src vend
# upstream OpenSSL 3.x for the legacy-probes subsystem (see Cargo.toml
# `legacy-probes` feature). All require the OpenSSL license exception —
# this repo is MIT OR Apache-2.0 + OpenSSL (declared in LICENSE-OPENSSL).
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-sys"

[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "openssl-sys"

[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "openssl-src"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
