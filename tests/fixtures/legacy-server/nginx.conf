# Legacy-probe integration fixture — nginx config.
#
# Every directive below is deliberately misconfigured or relaxed to give
# kemist's legacy probes something real to observe. DO NOT use any of
# this in production.

worker_processes 1;
events { worker_connections 64; }

http {
    # Broad legacy-suite coverage — the @SECLEVEL=0 unblocks RC4, DES,
    # 3DES, NULL, anon, and export ciphers.
    ssl_ciphers "ALL:COMPLEMENTOFALL:@SECLEVEL=0";
    ssl_prefer_server_ciphers off;

    # Every TLS protocol the scanner can probe (except SSLv3 and SSLv2 —
    # nginx on OpenSSL 1.1.1 can't enable them even with SECLEVEL=0).
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # 1024-bit custom DH group — drives `tls.dh_parameters[]` with a
    # `classification: custom` entry.
    ssl_dhparam /etc/nginx/certs/dh1024.pem;

    # Renegotiation is disabled by default in modern nginx; for the
    # client-initiated renegotiation probe we want the server-side
    # behavior to be the baseline "reject" path. No extra config needed.

    # Explicitly advertise SCSV enforcement at the server level.
    # (Nginx + OpenSSL 1.1.1 enforce RFC 7507 by default when the client
    # signals SEND_FALLBACK_SCSV with max < server-max.)

    server {
        listen 443 ssl;
        server_name legacy-fixture.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Optional client auth — fires CertificateRequest but doesn't
        # abort on empty-cert response. The client-auth probe records
        # `client_auth_request.requested: true, alert_on_empty_cert: null`
        # against this server.
        ssl_verify_client optional;
        ssl_client_certificate /etc/nginx/certs/client-ca.crt;
        ssl_verify_depth 2;

        location / {
            add_header X-Test-Fixture "kemist-legacy-probe" always;
            return 200 "kemist-fixture-ok\n";
        }
    }
}
